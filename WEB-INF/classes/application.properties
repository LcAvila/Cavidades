# =====================================================================
# CustomFusionWeb - configuracao
# Valores podem ser sobrescritos por variaveis de ambiente
# (ex.: APP_FUSION_API_TOKEN -> app.fusion.api-token).
# =====================================================================

# --- Banco SQLite (fonte de verdade do projeto) ------------------------
# Vazio = padrao do sistema operacional:
#   Linux: /opt/neomind/fusion/config/customfusion.db
#   Windows: %USERPROFILE%\.customfusion\customfusion.db
# Tambem pode ser definido por APP_SQLITE_PATH. Se apontar para um diretorio,
# o arquivo customfusion.db sera criado dentro dele.
app.sqlite.path=

# --- Identificacao de usuario (sem tela de login) ---------------------
# FQN da classe PortalUtil do Fusion, usada via reflexao.
# Deixe vazio para usar os candidatos embutidos; se nenhum acertar,
# descubra no projeto Fusion (Eclipse: F3 na classe) e preencha aqui.
app.fusion.portal-util-class=
# Codigo do papel/grupo do Fusion tratado como administrador do projeto.
# Usuarios com este papel ou grupo recebem acesso total (equivalente ao admin do Fusion).
# Vazio desativa o bypass por papel/grupo.
app.seguranca.papel-admin=admG
# Logins (separados por virgula) com acesso total de administrador.
# Util para bootstrap quando o flag admin do Fusion nao e resolvido.
app.seguranca.admin-logins=adm
# Usuario de DESENVOLVIMENTO LOCAL (sem Fusion). Vazio = exige sessao
# do Fusion em toda chamada /api/*.
app.dev.usuario=
# Permite o fallback acima mesmo quando o Fusion estiver presente mas sem
# sessao resolvida. Use apenas em testes controlados.
app.dev.permitir-fallback=false

# --- GED do Fusion (publicacao de documentos) -------------------------
# POST {base-url}/fusion/api/v1/documents/  (header: Token)
# base-url = raiz do servidor; se ja incluir /fusion, o segmento nao e duplicado.
app.fusion.base-url=https://hml.compactortech.com.br/fusion
# Token: use application-local.properties (nao versionado) ou APP_FUSION_API_TOKEN.
app.fusion.api-token=
app.fusion.doc-type=RELATORIOCAVIDADES
app.fusion.folder-base=Cavidades N\u00e3o Conformes
# true = publica em folder-base/<codigo do molde>; false = direto em folder-base
app.fusion.folder-por-molde=false
# published (padrao) ou edition (quando houver assinatura eletronica)
app.fusion.doc-status=published
# JSON opcional com campos extras exigidos pelo tipo de documento,
# ex.: {"title":"Relatorio de cavidades","codigo":"R001"}
app.fusion.doc-fields-extra=
# Author fixo (codigo do usuario no Fusion). Vazio = usa o usuario da sessao.
app.fusion.author-padrao=

# --- SSO Fusion -> Cavidades (token assinado) -------------------------
# Vazio = <catalina.base>/conf/cavidades-sso.secret
app.sso.secret-file=
app.sso.cookie-name=CAVIDADES_SSO

# --- Autodesk Platform Services (APS) ---------------------------------
# Crie um app em https://aps.autodesk.com/myapps e informe as credenciais.
# Sem client-id/client-secret o 3D usa o viewer Three.js local (fallback),
# sem enviar nenhum arquivo para a nuvem.
app.aps.client-id=
app.aps.client-secret=
# Bucket OSS. Vazio = derivado do Client ID (precisa ser unico na Autodesk).
app.aps.bucket=
# Viewer oficial (versao fixa para evitar mudanca silenciosa de comportamento).
app.aps.viewer-version=7.100.0
app.aps.env=AutodeskProduction2
app.aps.api=streamingV2
# Cache dos URNs ja traduzidos. Vazio = %TEMP%/customfusion-aps-cache.json.
app.aps.cache-file=
